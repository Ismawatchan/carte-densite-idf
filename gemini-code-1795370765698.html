<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Densité de Population - Île-de-France (Étape 1)</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow: hidden; }
        #map { width: 100%; height: 100vh; z-index: 1; background-color: #f8fafc; }
        .custom-tooltip {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 10px;
            color: #fff;
            padding: 8px 12px;
            font-family: 'Inter', sans-serif;
            pointer-events: none;
        }
        .leaflet-tooltip-top.custom-tooltip::before { border-top-color: rgba(15, 23, 42, 0.95); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <!-- Bandeau supérieur -->
    <header class="fixed top-4 left-4 right-4 z-[1000] pointer-events-none flex flex-wrap items-center justify-between gap-3">
        <div class="pointer-events-auto bg-white/95 backdrop-blur-md border border-slate-200 shadow-lg rounded-2xl p-3 flex flex-wrap items-center gap-2">
            <div class="pr-2">
                <h1 class="text-sm sm:text-base font-bold text-slate-900">Densité Île-de-France</h1>
                <p id="status-subtitle" class="text-[11px] text-slate-500">Chargement des données INSEE / GeoAPI...</p>
            </div>

            <div class="flex flex-wrap items-center gap-1.5" id="dept-filters">
                <button data-dept="ALL" class="dept-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-white">Tout IDF</button>
                <button data-dept="PETITE" class="dept-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-amber-50 text-amber-900 border border-amber-200">Petite Couronne</button>
                <button data-dept="GRANDE" class="dept-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700">Grande Couronne</button>
                <button data-dept="75" class="dept-btn px-2 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700">75</button>
                <button data-dept="92" class="dept-btn px-2 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700">92</button>
                <button data-dept="93" class="dept-btn px-2 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700">93</button>
                <button data-dept="94" class="dept-btn px-2 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700">94</button>
                <button data-dept="77" class="dept-btn px-2 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700">77</button>
                <button data-dept="78" class="dept-btn px-2 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700">78</button>
                <button data-dept="91" class="dept-btn px-2 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700">91</button>
                <button data-dept="95" class="dept-btn px-2 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700">95</button>
            </div>
        </div>
    </header>

    <main id="map"></main>

    <script>
        const DENSITY_CLASSES = [
            { id: 0, min: 0,     max: 500,      color: '#fef0d9', label: '< 500' },
            { id: 1, min: 500,   max: 2500,     color: '#fdd49e', label: '500 – 2 500' },
            { id: 2, min: 2500,  max: 7000,     color: '#fdbb84', label: '2 500 – 7 000' },
            { id: 3, min: 7000,  max: 14000,    color: '#fc8d59', label: '7 000 – 14 000' },
            { id: 4, min: 14000, max: 22000,    color: '#ef6548', label: '14 000 – 22 000' },
            { id: 5, min: 22000, max: 30000,    color: '#d7301f', label: '22 000 – 30 000' },
            { id: 6, min: 30000, max: Infinity, color: '#99000d', label: '> 30 000' }
        ];

        const PETITE_COURONNE = new Set(['75', '92', '93', '94']);
        const GRANDE_COURONNE = new Set(['77', '78', '91', '95']);

        let map = null;
        let geoLayer = null;
        let features = [];
        let selectedDept = 'ALL';

        function getDensityClass(density) {
            for (const cls of DENSITY_CLASSES) {
                if (density >= cls.min && density < cls.max) return cls;
            }
            return DENSITY_CLASSES[DENSITY_CLASSES.length - 1];
        }

        function matchesDeptFilter(deptCode) {
            if (selectedDept === 'ALL') return true;
            if (selectedDept === 'PETITE') return PETITE_COURONNE.has(deptCode);
            if (selectedDept === 'GRANDE') return GRANDE_COURONNE.has(deptCode);
            return deptCode === selectedDept;
        }

        function initMap() {
            map = L.map('map', {
                center: [48.74, 2.45],
                zoom: 9,
                preferCanvas: true
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO | INSEE / GeoAPI',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);
        }

        async function loadData() {
            const depts = ['77', '78', '91', '92', '93', '94', '95'];
            const promises = depts.map(code =>
                fetch(`https://geo.api.gouv.fr/departements/${code}/communes?fields=nom,code,codeDepartement,population,surface,contour&format=geojson&geometry=contour`)
                    .then(r => r.ok ? r.json() : { features: [] })
            );

            const parisPromise = fetch('https://geo.api.gouv.fr/communes?codeDepartement=75&type=arrondissement-municipal&fields=nom,code,codeDepartement,population,surface,contour&format=geojson&geometry=contour')
                .then(r => r.ok ? r.json() : { features: [] });

            const results = await Promise.all([...promises, parisPromise]);
            const raw = [];
            results.forEach(fc => {
                if (fc && Array.isArray(fc.features)) raw.push(...fc.features);
            });

            features = raw.map(f => {
                const p = f.properties || {};
                const pop = Number(p.population) || 0;
                const areaKm2 = p.surface ? Number(p.surface) / 100 : 1;
                const density = areaKm2 > 0 ? pop / areaKm2 : 0;
                const deptCode = p.codeDepartement || String(p.code || '').substring(0, 2);
                const displayName = String(p.nom || '').replace(' Arrondissement', '');
                return {
                    ...f,
                    properties: { ...p, displayName, deptCode, population: pop, areaKm2, density, densityClass: getDensityClass(density) }
                };
            });

            document.getElementById('status-subtitle').textContent = `${features.length} territoires chargés (75–95)`;
            renderLayer();
        }

        function renderLayer() {
            if (geoLayer) map.removeLayer(geoLayer);

            geoLayer = L.geoJSON(features, {
                filter: f => matchesDeptFilter(f.properties.deptCode),
                style: f => ({
                    fillColor: f.properties.densityClass.color,
                    weight: 0.7,
                    opacity: 1,
                    color: '#ffffff',
                    fillOpacity: 0.84
                }),
                onEachFeature: (f, layer) => {
                    const p = f.properties;
                    layer.bindTooltip(
                        `<strong>${p.displayName}</strong> (${p.deptCode})<br>${Math.round(p.density).toLocaleString('fr-FR')} hab/km² • ${p.population.toLocaleString('fr-FR')} hab.`,
                        { sticky: true, className: 'custom-tooltip' }
                    );
                }
            }).addTo(map);
        }

        document.querySelectorAll('.dept-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.dept-btn').forEach(b => {
                    b.classList.remove('bg-slate-900', 'text-white');
                    b.classList.add('bg-slate-100', 'text-slate-700');
                });
                btn.classList.remove('bg-slate-100', 'text-slate-700');
                btn.classList.add('bg-slate-900', 'text-white');
                selectedDept = btn.dataset.dept;
                renderLayer();
                if (geoLayer && geoLayer.getLayers().length > 0) {
                    map.fitBounds(geoLayer.getBounds(), { padding: [30, 30] });
                }
            });
        });

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            loadData();
        });
    </script>
</body>
</html>
