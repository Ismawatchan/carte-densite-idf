<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Île-de-France — Départements, Villes et Zones</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #map {
            width: 100%;
            height: 100%;
            background: #f1f5f9;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        const DEPTS = ['75', '77', '78', '91', '92', '93', '94', '95'];

        const map = L.map('map', {
            center: [48.74, 2.45],
            zoom: 9
        });

        // Fond de carte public sans clé API
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        const communesLayer = L.geoJSON(null, {
            style: {
                color: '#334155',
                weight: 1,
                opacity: 0.9,
                fillColor: '#94a3b8',
                fillOpacity: 0.14
            },
            onEachFeature: (feature, layer) => {
                const nom = feature.properties && feature.properties.nom ? feature.properties.nom : '';
                if (nom) layer.bindTooltip(nom, { sticky: true });

                layer.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    outlineZonesOfCity(feature, layer);
                });
            }
        }).addTo(map);

        // Limites des 8 départements (traits épais et nets)
        const departementsLayer = L.geoJSON(null, {
            interactive: false,
            style: {
                color: '#0f172a',
                weight: 3,
                opacity: 0.95,
                fill: false
            }
        }).addTo(map);

        // Découpage en zones / quartiers de la ville cliquée
        const zonesLayer = L.geoJSON(null, {
            interactive: false,
            style: {
                color: '#dc2626',
                weight: 2,
                dashArray: '5, 4',
                fillColor: '#ef4444',
                fillOpacity: 0.12
            }
        }).addTo(map);

        let parisQuartiers = null;

        async function loadIleDeFrance() {
            const communeReqs = DEPTS.map(code =>
                fetch(`https://geo.api.gouv.fr/communes?codeDepartement=${code}&fields=nom,code,codeDepartement,contour&format=geojson`)
                    .then(r => r.ok ? r.json() : { features: [] })
            );

            const deptReqs = DEPTS.map(code =>
                fetch(`https://geo.api.gouv.fr/departements/${code}?fields=nom,code,contour&format=geojson`)
                    .then(r => r.ok ? r.json() : null)
            );

            const parisQReq = fetch('https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/quartier_paris/exports/geojson')
                .then(r => r.ok ? r.json() : null)
                .catch(() => null);

            const [communesResults, deptResults, qParis] = await Promise.all([
                Promise.all(communeReqs),
                Promise.all(deptReqs),
                parisQReq
            ]);

            parisQuartiers = qParis;

            const allCommunes = [];
            communesResults.forEach(fc => {
                if (fc && Array.isArray(fc.features)) {
                    allCommunes.push(...fc.features);
                }
            });
            communesLayer.addData({ type: 'FeatureCollection', features: allCommunes });

            const allDepts = deptResults.filter(d => d && d.geometry);
            departementsLayer.addData({ type: 'FeatureCollection', features: allDepts });

            if (communesLayer.getLayers().length > 0) {
                map.fitBounds(communesLayer.getBounds(), { padding: [20, 20] });
            }
        }

        function splitBoundsIntoZones(feature) {
            const b = L.geoJSON(feature).getBounds();
            const w = b.getWest(), e = b.getEast(), s = b.getSouth(), n = b.getNorth();
            const mw = (w + e) / 2, ms = (s + n) / 2;

            const boxes = [
                [[w, ms], [mw, ms], [mw, n], [w, n], [w, ms]],
                [[mw, ms], [e, ms], [e, n], [mw, n], [mw, ms]],
                [[w, s], [mw, s], [mw, ms], [w, ms], [w, s]],
                [[mw, s], [e, s], [e, ms], [mw, ms], [mw, s]]
            ];

            return boxes.map(ring => ({
                type: 'Feature',
                geometry: { type: 'Polygon', coordinates: [ring] },
                properties: {}
            }));
        }

        async function outlineZonesOfCity(feature, layer) {
            zonesLayer.clearLayers();
            map.fitBounds(layer.getBounds(), { padding: [40, 40], maxZoom: 14 });

            const p = feature.properties || {};
            const code = String(p.code || '');
            const dept = String(p.codeDepartement || code.substring(0, 2));

            // Paris (75) : découpage en quartiers administratifs
            if (dept === '75' && parisQuartiers && Array.isArray(parisQuartiers.features)) {
                const qList = parisQuartiers.features.filter(qf => qf.geometry);
                if (qList.length > 0) {
                    zonesLayer.addData({ type: 'FeatureCollection', features: qList });
                    return;
                }
            }

            // Autres villes : recherche des quartiers/zones dans OpenStreetMap (Overpass)
            try {
                const query = `
                    [out:json][timeout:8];
                    area["ref:INSEE"="${code}"]->.city;
                    (
                        relation(area.city)["boundary"="administrative"]["admin_level"~"9|10"];
                        way(area.city)["place"~"suburb|neighbourhood|quarter"];
                    );
                    out geom;
                `;
                const resp = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: query
                });
                if (resp.ok) {
                    const data = await resp.json();
                    const polys = [];
                    (data.elements || []).forEach(el => {
                        if (el.type === 'way' && Array.isArray(el.geometry) && el.geometry.length >= 4) {
                            const coords = el.geometry.map(pt => [pt.lon, pt.lat]);
                            const first = coords[0], last = coords[coords.length - 1];
                            if (first[0] === last[0] && first[1] === last[1]) {
                                polys.push({
                                    type: 'Feature',
                                    geometry: { type: 'Polygon', coordinates: [coords] },
                                    properties: {}
                                });
                            }
                        }
                    });
                    if (polys.length > 0) {
                        zonesLayer.addData({ type: 'FeatureCollection', features: polys });
                        return;
                    }
                }
            } catch (_) {}

            // Découpage en zones si aucun contour de quartier n'est renvoyé
            zonesLayer.addData({ type: 'FeatureCollection', features: splitBoundsIntoZones(feature) });
        }

        loadIleDeFrance();
    </script>
</body>
</html>
