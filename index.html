<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Île-de-France — Départements, Villes et Zones</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #map {
            width: 100%;
            height: 100%;
            background: #f1f5f9;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        const DEPTS = ['75', '77', '78', '91', '92', '93', '94', '95'];

        const map = L.map('map', {
            center: [48.74, 2.45],
            zoom: 9
        });

        // Fond de carte public sans clé API
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // 1. Villes / Communes : contour intermédiaire (gris-bleu net, moins épais que les départements)
        const communesLayer = L.geoJSON(null, {
            style: {
                color: '#475569',
                weight: 1.2,
                opacity: 0.75,
                fillColor: '#94a3b8',
                fillOpacity: 0.08
            },
            onEachFeature: (feature, layer) => {
                const nom = feature.properties && feature.properties.nom ? feature.properties.nom : '';
                if (nom) layer.bindTooltip(nom, { sticky: true });

                layer.on({
                    mouseover: (e) => {
                        e.target.setStyle({
                            color: '#1e293b',
                            weight: 2,
                            fillOpacity: 0.18
                        });
                    },
                    mouseout: (e) => {
                        communesLayer.resetStyle(e.target);
                    },
                    click: (e) => {
                        L.DomEvent.stopPropagation(e);
                        outlineZonesOfCity(feature, layer);
                    }
                });
            }
        }).addTo(map);

        // 2. Départements : contour très marquant (double trait : halo blanc épais + trait bleu nuit/indigo épais)
        const departementsHaloLayer = L.geoJSON(null, {
            interactive: false,
            style: {
                color: '#ffffff',
                weight: 8,
                opacity: 0.92,
                fill: false
            }
        }).addTo(map);

        const departementsLayer = L.geoJSON(null, {
            interactive: false,
            style: {
                color: '#1e1b4b',
                weight: 4.5,
                opacity: 1,
                fill: false
            }
        }).addTo(map);

        // 3. Quartiers / Arrondissements : contour discret et léger (fin, pointillés fins, faible opacité)
        const zonesLayer = L.geoJSON(null, {
            interactive: false,
            style: {
                color: '#64748b',
                weight: 0.9,
                opacity: 0.65,
                dashArray: '3, 3',
                fillColor: '#3b82f6',
                fillOpacity: 0.06
            }
        }).addTo(map);

        let parisArrondissements = null;
        let parisQuartiers = null;

        async function loadIleDeFrance() {
            const communeReqs = DEPTS.map(code =>
                fetch(`https://geo.api.gouv.fr/communes?codeDepartement=${code}&fields=nom,code,codeDepartement,contour&format=geojson`)
                    .then(r => r.ok ? r.json() : { features: [] })
            );

            // IMPORTANT : geo.api.gouv.fr/departements/{code} renvoie un Feature unique (pas un FeatureCollection)
            const deptReqs = DEPTS.map(code =>
                fetch(`https://geo.api.gouv.fr/departements/${code}?fields=nom,code,contour&format=geojson`)
                    .then(r => r.ok ? r.json() : null)
            );

            // Arrondissements officiels de Paris (75101 à 75120)
            const parisArrReq = fetch('https://geo.api.gouv.fr/communes?codeDepartement=75&type=arrondissement-municipal&fields=nom,code,contour&format=geojson')
                .then(r => r.ok ? r.json() : null)
                .catch(() => null);

            // 80 quartiers administratifs de Paris
            const parisQReq = fetch('https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/quartier_paris/exports/geojson')
                .then(r => r.ok ? r.json() : null)
                .catch(() => null);

            const [communesResults, deptResults, arrParis, qParis] = await Promise.all([
                Promise.all(communeReqs),
                Promise.all(deptReqs),
                parisArrReq,
                parisQReq
            ]);

            parisArrondissements = arrParis;
            parisQuartiers = qParis;

            const allCommunes = [];
            communesResults.forEach(fc => {
                if (fc && Array.isArray(fc.features)) {
                    allCommunes.push(...fc.features);
                }
            });
            communesLayer.addData({ type: 'FeatureCollection', features: allCommunes });

            // Extraction fiable du polygone départemental (Feature direct ou FeatureCollection)
            const allDepts = [];
            deptResults.forEach(d => {
                if (!d) return;
                if (d.type === 'Feature' && d.geometry) {
                    allDepts.push(d);
                } else if (d.type === 'FeatureCollection' && Array.isArray(d.features)) {
                    allDepts.push(...d.features.filter(f => f && f.geometry));
                } else if (d.contour) {
                    allDepts.push({ type: 'Feature', geometry: d.contour, properties: { code: d.code, nom: d.nom } });
                }
            });

            const deptGeoJson = { type: 'FeatureCollection', features: allDepts };
            departementsHaloLayer.addData(deptGeoJson);
            departementsLayer.addData(deptGeoJson);

            departementsHaloLayer.bringToFront();
            departementsLayer.bringToFront();

            if (communesLayer.getLayers().length > 0) {
                map.fitBounds(communesLayer.getBounds(), { padding: [20, 20] });
            }
        }

        // Convertit les relations/chemins Overpass en vrais polygones fermés GeoJSON
        function buildPolygonsFromOverpass(elements) {
            const polys = [];
            const seen = new Set();

            (elements || []).forEach(el => {
                const name = (el.tags && (el.tags.name || el.tags['name:fr'])) || String(el.id);

                if (el.type === 'way' && Array.isArray(el.geometry) && el.geometry.length >= 4) {
                    const coords = el.geometry.map(pt => [pt.lon, pt.lat]);
                    const first = coords[0], last = coords[coords.length - 1];
                    if (first[0] === last[0] && first[1] === last[1] && !seen.has(name)) {
                        seen.add(name);
                        polys.push({
                            type: 'Feature',
                            geometry: { type: 'Polygon', coordinates: [coords] },
                            properties: { name }
                        });
                    }
                } else if (el.type === 'relation' && Array.isArray(el.members)) {
                    const outerRings = [];
                    el.members.forEach(m => {
                        if (m.role === 'outer' && Array.isArray(m.geometry) && m.geometry.length >= 4) {
                            const coords = m.geometry.map(pt => [pt.lon, pt.lat]);
                            const first = coords[0], last = coords[coords.length - 1];
                            if (first[0] === last[0] && first[1] === last[1]) {
                                outerRings.push([coords]);
                            }
                        }
                    });
                    if (outerRings.length > 0 && !seen.has(name)) {
                        seen.add(name);
                        polys.push({
                            type: 'Feature',
                            geometry: { type: 'MultiPolygon', coordinates: outerRings },
                            properties: { name }
                        });
                    }
                }
            });

            return polys;
        }

        async function outlineZonesOfCity(feature, layer) {
            zonesLayer.clearLayers();
            map.fitBounds(layer.getBounds(), { padding: [40, 40], maxZoom: 14 });

            const p = feature.properties || {};
            const code = String(p.code || '');
            const dept = String(p.codeDepartement || code.substring(0, 2));

            // 1. Paris (75) : tracé des arrondissements + quartiers administratifs (uniquement si disponibles)
            if (dept === '75') {
                const featuresToDraw = [];
                if (parisArrondissements && Array.isArray(parisArrondissements.features)) {
                    featuresToDraw.push(...parisArrondissements.features.filter(f => f && f.geometry));
                }
                if (parisQuartiers && Array.isArray(parisQuartiers.features)) {
                    featuresToDraw.push(...parisQuartiers.features.filter(f => f && f.geometry));
                }
                if (featuresToDraw.length > 0) {
                    zonesLayer.addData({ type: 'FeatureCollection', features: featuresToDraw });
                    departementsHaloLayer.bringToFront();
                    departementsLayer.bringToFront();
                    return;
                }
            }

            // 2. Autres villes : vrais contours de quartiers/secteurs dans OpenStreetMap (relations + ways)
            try {
                const query = `
                    [out:json][timeout:8];
                    area["ref:INSEE"="${code}"]->.city;
                    (
                        relation(area.city)["boundary"="administrative"]["admin_level"~"9|10"];
                        relation(area.city)["place"~"suburb|neighbourhood|quarter"];
                        way(area.city)["place"~"suburb|neighbourhood|quarter"];
                    );
                    out geom;
                `;
                const resp = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    body: query
                });
                if (resp.ok) {
                    const data = await resp.json();
                    const polys = buildPolygonsFromOverpass(data.elements);
                    if (polys.length > 0) {
                        zonesLayer.addData({ type: 'FeatureCollection', features: polys });
                        departementsHaloLayer.bringToFront();
                        departementsLayer.bringToFront();
                        return;
                    }
                }
            } catch (_) {}

            // Si aucun quartier réel n'existe dans les données pour cette commune, on garde uniquement le contour de la ville
            departementsHaloLayer.bringToFront();
            departementsLayer.bringToFront();
        }

        loadIleDeFrance();
    </script>
</body>
</html>
